services:
  # 1. Backend Service (FastAPI)
  - type: web
    name: ibc-backend
    env: python
    rootDir: ibc/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ibc-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Frontend Service (React/Vite)
  - type: static
    name: ibc-frontend
    env: node
    rootDir: ibc/frontend
    buildCommand: npm install && npm run build
    staticPublishDir: dist
    envVars:
      - key: VITE_API_URL
        # This will automatically pick up the backend URL once deployed
        fromService:
          type: web
          name: ibc-backend
          property: url

databases:
  - name: ibc-db
    plan: free
