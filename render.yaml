services:
  # 1. Backend Service (FastAPI)
  - type: web
    name: ibc-backend
    runtime: python
    rootDir: ibc/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ibc-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Frontend Service (React/Vite)
  - type: web
    name: ibc-frontend
    runtime: static
    rootDir: ibc/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "REPLACE_ME_WITH_BACKEND_URL_ONCE_LIVE" # e.g. https://ibc-backend.onrender.com/api/v1

databases:
  - name: ibc-db
    plan: free
